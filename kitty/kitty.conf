# ==========================================
# CORE & BEHAVIOR
# ==========================================
term xterm-kitty
enable_audio_bell no

# Wayland native support for Fedora (Prevents X11 blurriness)
linux_display_server auto

# ==========================================
# FONT CONFIGURATION
# ==========================================
# Swapped to JetBrains (which we installed) or you can use SauceCodePro
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

map ctrl+shift+backspace change_font_size all 0

# ==========================================
# CURSOR & SCROLLBACK
# ==========================================
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 0
shell_integration no-cursor

scrollback_lines 5000
wheel_scroll_multiplier 3.0
mouse_hide_wait -1

# ==========================================
# WINDOW LAYOUT & BORDERS
# ==========================================
remember_window_size  no
initial_window_width  1200
initial_window_height 750

# Removes the top title bar in GNOME
hide_window_decorations yes

window_border_width 1.5pt
enabled_layouts tall, stack
window_padding_width 4
window_margin_width 2

map ctrl+shift+enter new_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window
map ctrl+shift+l next_layout
map ctrl+alt+r goto_layout tall
map ctrl+alt+s goto_layout stack

# ==========================================
# TAB BAR CUSTOMIZATION
# ==========================================
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge bottom
tab_bar_align left
active_tab_font_style  bold
inactive_tab_font_style normal

map ctrl+shift+t new_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+q close_tab

# ==========================================
# THE "ASH & ORANGE" THEME
# ==========================================
background_opacity 1.0
background_blur 1

# Deep Ash Background, Soft Gray Text
background               #18181a
foreground               #d4d4d6

# Selection Colors
selection_foreground     #18181a
selection_background     #ff7a00

# Window border Colors (Orange for active)
active_border_color      #ff7a00
inactive_border_color    #3f3f44

# Kitty tabs colors 
active_tab_foreground    #18181a
active_tab_background    #ff7a00
inactive_tab_foreground  #b4b4b8
inactive_tab_background  #242427

# Cursor colors
cursor                   #ff7a00
cursor_text_color        #18181a

# Url color
url_color                #d97736

